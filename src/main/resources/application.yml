spring:
  application:
    name: pokevault
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pokevault}
    username: ${DATABASE_USERNAME:pokevault}
    password: ${DATABASE_PASSWORD:pokevault}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

